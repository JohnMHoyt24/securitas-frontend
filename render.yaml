services:
  - type: web
    name: securitas-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.securitas-aml.app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
